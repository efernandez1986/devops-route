<script type="text/plain" id="guias">
## 1
- En PowerShell (como administrador): $ wsl --install -d Ubuntu   y reinicia; crea tu usuario
- $ ls /
- $ ls /etc | head
- $ cat /etc/os-release
- $ cat /proc/meminfo | head
- $ ls /var/log
- $ ps aux | head
> Dibujas el árbol de / de memoria y corriges, como mucho, 2 carpetas al compararlo con ls /.
## 2
- $ mkdir -p ~/lab && cd ~/lab
- $ ls /etc > etc.txt && wc -l etc.txt
- $ ls /noexiste 2> errores.txt; cat errores.txt
- $ find /var -type f -printf '%s %p\n' 2>/dev/null | sort -rn | head -10
> Obtienes los 10 archivos más grandes de /var con un solo one-liner y explicas cada parte.
## 3
- $ sudo adduser ana && sudo adduser beto
- $ sudo groupadd equipo && sudo usermod -aG equipo ana && sudo usermod -aG equipo beto
- $ sudo mkdir /srv/compartido && sudo chgrp equipo /srv/compartido
- $ sudo chmod 2770 /srv/compartido && sudo chmod +t /srv/compartido
- $ sudo -u ana touch /srv/compartido/a.txt
- $ sudo -u beto rm /srv/compartido/a.txt   (debe fallar por el sticky bit)
> Ana crea un archivo, Beto no puede borrarlo y sabes decir qué bit lo impide.
## 4
- En WSL2 activa systemd: agrega "[boot]" y "systemd=true" a /etc/wsl.conf y ejecuta $ wsl --shutdown desde Windows
- $ printf '#!/bin/bash\nwhile true; do date >> /tmp/hola.log; sleep 5; done\n' > ~/hola.sh && chmod +x ~/hola.sh
- Crea /etc/systemd/system/hola.service con [Service] ExecStart=/home/TU_USUARIO/hola.sh y Restart=on-failure, y [Install] WantedBy=multi-user.target
- $ sudo systemctl daemon-reload && sudo systemctl enable --now hola
- $ sudo kill -9 $(systemctl show -p MainPID --value hola)
- $ journalctl -u hola -n 20
> Matas el proceso con kill -9 y systemd lo levanta solo; lo ves en journalctl.
## 5
- $ awk 'BEGIN{srand(); for(i=0;i<200;i++) printf "10.0.0.%d - - [01/Jan/2025] \"GET /p%d HTTP/1.1\" %d 123\n", int(rand()*10), int(rand()*5), (rand()<0.8?200:500)}' > access.log
- $ awk '{print $1}' access.log | sort | uniq -c | sort -rn | head
- $ awk '{print $(NF-1)}' access.log | sort | uniq -c
- $ grep -c ' 500 ' access.log
- $ sed -n '1,5p' access.log
> Sacas el top de IPs y el conteo por código de estado, cada uno con un solo comando.
## 6
- $ dd if=/dev/zero of=disco.img bs=1M count=64
- $ mkfs.ext4 -N 256 disco.img   (solo 256 inodos, a propósito)
- $ sudo mkdir -p /mnt/prueba && sudo mount -o loop disco.img /mnt/prueba
- $ sudo bash -c 'cd /mnt/prueba; for i in $(seq 1 400); do touch f$i; done'
- $ df -h /mnt/prueba && df -i /mnt/prueba
- $ sudo umount /mnt/prueba
> Reproduces «No space left on device» con df -h mostrando espacio libre y explicas por qué (df -i).
## 7
- $ ssh-keygen -t ed25519
- $ sudo apt install -y openssh-server && sudo systemctl enable --now ssh
- $ ssh-copy-id localhost
- Edita /etc/ssh/sshd_config: PasswordAuthentication no y PermitRootLogin no
- $ sudo sshd -t && sudo systemctl reload ssh
- $ ssh localhost
- $ ssh -L 8080:localhost:80 localhost
> Entras solo con clave, la contraseña es rechazada y el túnel -L responde.
## 8
- Entra a overthewire.org/wargames/bandit y resuelve los niveles 0 a 10
- $ ssh bandit0@bandit.labs.overthewire.org -p 2220   (contraseña: bandit0)
- Comandos que usarás: ls -a, cat ./-, file, find, strings, base64 -d, sort | uniq -u, tr
- Anota cada contraseña y el comando con que la obtuviste
> Llegas al nivel 10 y tienes una lista de ~20 comandos con una línea de «para qué sirve».
## 9
- $ sudo apt install -y tcpdump curl
- Terminal A: $ sudo tcpdump -i any -nn 'tcp port 80' -c 12
- Terminal B: $ curl -sI http://example.com > /dev/null
- Identifica los flags: [S] SYN, [S.] SYN-ACK, [.] ACK, [F.] FIN
- Opcional: en Wireshark filtra tcp.flags.syn==1
> Señalas en la captura las tres líneas del handshake y las del cierre.
## 10
- $ sudo apt install -y ipcalc
- $ ipcalc 10.0.0.0/16
- $ ipcalc 10.0.1.0/24
- Diseña una tabla: dev 10.0.0.0/20, stage 10.0.16.0/20, prod 10.0.32.0/20, con subredes públicas y privadas por AZ
- Verifica que no se solapen
> Tienes una tabla de CIDR sin solapes y sabes cuántos hosts caben en cada bloque.
## 11
- $ dig +trace example.com
- $ dig example.com A +short
- $ dig example.com NS +short
- $ dig @1.1.1.1 example.com MX
- $ dig -x 8.8.8.8 +short
> Explicas cada salto (raíz → TLD → autoritativo) y el TTL de la respuesta final.
## 12
- $ curl -v https://example.com -o /dev/null
- $ curl -I https://example.com
- $ echo | openssl s_client -connect example.com:443 -servername example.com 2>/dev/null | openssl x509 -noout -subject -issuer -dates
- $ curl -s -o /dev/null -w '%{http_code}\n' https://example.com/no-existe
- Repite con 3 sitios y anota emisor y fecha de expiración
> Para 3 sitios sabes emisor, expiración y versión de TLS negociada.
## 13
- $ sudo apt install -y nginx
- Crea dos carpetas con un index.html distinto y sirve cada una: $ python3 -m http.server 9001  /  $ python3 -m http.server 9002
- /etc/nginx/conf.d/lb.conf: upstream app { server 127.0.0.1:9001; server 127.0.0.1:9002; } server { listen 8081; location / { proxy_pass http://app; } }
- $ sudo nginx -t && sudo systemctl reload nginx
- $ for i in 1 2 3 4; do curl -s localhost:8081; done
- Detén un backend y repite
> Ves alternar las respuestas y, al caer un backend, nginx sigue sirviendo con el otro.
## 14
- Falla 1 (DNS): añade «1.2.3.4 example.com» a /etc/hosts y prueba $ curl example.com; diagnostica con $ getent hosts example.com
- Falla 2 (puerto): $ nc -zv localhost 9999 falla; confirma con $ ss -tulpn
- Falla 3 (ruta): $ sudo ip route add blackhole 8.8.8.8 y luego $ ping 8.8.8.8; diagnostica con $ ip route get 8.8.8.8
- Limpia: quita la línea de /etc/hosts y $ sudo ip route del blackhole 8.8.8.8
- Usa $ mtr -rwc 5 example.com para ver el camino
> Para cada falla escribes: síntoma → comando que lo confirmó → causa → arreglo.
## 15
- $ git init lab-git && cd lab-git
- $ echo 'hola' | git hash-object -w --stdin
- $ git cat-file -t <SHA> && git cat-file -p <SHA>
- $ git update-index --add --cacheinfo 100644,<SHA>,hola.txt
- $ git write-tree
- $ git commit-tree <TREE> -m 'primer commit'
- $ git update-ref refs/heads/main <COMMIT> && git log --oneline
> Creas un commit sin usar git add ni git commit y explicas blob → tree → commit.
## 16
- $ git init lab16 && cd lab16 && echo a > f && git add f && git commit -m base
- $ git switch -c feat && echo b >> f && git commit -am feat
- $ git switch main && echo c >> f && git commit -am main
- $ git merge feat   (habrá conflicto: edita, git add f, git commit)
- Repite desde cero con $ git rebase main estando en feat
- $ git rebase -i HEAD~3   (reordena o haz squash)
- $ git log --oneline --graph --all
> Resuelves un conflicto de las dos maneras y ves en --graph la diferencia entre merge y rebase.
## 17
- Crea un repo en GitHub y clónalo
- Settings → Branches → regla en main: exigir PR y 1 aprobación
- $ git switch -c cambio-1 && (edita algo) && git push -u origin cambio-1
- Abre el PR, comenta una línea y apruébalo
- Haz «Squash and merge»
> No puedes hacer push directo a main y tu cambio entra solo por PR.
## 18
- $ git reset --hard HEAD~2   y luego $ git reflog && git reset --hard HEAD@{1}
- Crea 20 commits donde uno rompa test.sh: $ git bisect start && git bisect bad && git bisect good <SHA> && git bisect run ./test.sh
- $ git cherry-pick <SHA>
- Crea .git/hooks/pre-commit que falle si hay «TODO» y hazlo ejecutable con chmod +x
> bisect te da el commit culpable solo y recuperas commits «perdidos» con reflog.
## 19
- Haz 3 commits: feat: ..., fix: ... y feat!: ...
- $ git tag -a v0.1.0 -m 'primera versión'
- $ git log --pretty=format:'%s' v0.1.0
- Genera CHANGELOG.md agrupando Features y Fixes (a mano o con git-cliff)
> Tienes un tag v0.1.0 y un CHANGELOG con secciones Features y Fixes.
## 20
- Crea backup.sh con: shebang, set -euo pipefail, trap 'echo fallo en línea $LINENO >&2' ERR, SRC="${1:?uso: $0 DIR}" y tar czf "/tmp/backup-$(date +%F).tgz" "$SRC"
- Rotación: $ ls -1t /tmp/backup-*.tgz | tail -n +4 | xargs -r rm --
- $ chmod +x backup.sh && ./backup.sh ~/lab
- $ sudo apt install -y shellcheck && shellcheck backup.sh
- Pruébalo sin argumento y con un directorio inexistente
> ShellCheck no da avisos y el script falla con un mensaje claro ante entradas malas.
## 21
- $ crontab -e   → */2 * * * * /home/TU_USUARIO/backup.sh ~/lab >> ~/cron.log 2>&1
- /etc/systemd/system/backup.service: [Service] Type=oneshot, ExecStart=/home/TU_USUARIO/backup.sh /home/TU_USUARIO/lab
- /etc/systemd/system/backup.timer: [Timer] OnCalendar=*:0/5 y Persistent=true; [Install] WantedBy=timers.target
- $ sudo systemctl daemon-reload && sudo systemctl enable --now backup.timer
- $ systemctl list-timers | grep backup
- $ journalctl -u backup.service -n 10
> El timer aparece en list-timers y ves sus ejecuciones en journalctl.
## 22
- $ python3 -m venv .venv && source .venv/bin/activate
- Crea metricas.json con una lista de objetos {servicio, latencia_ms, ok}
- Escribe resumen.py: lee el JSON, calcula media de latencia y % ok por servicio y lo imprime como tabla
- $ python resumen.py metricas.json
- Agrega if __name__ == '__main__': y argparse para la ruta
> El script resume las métricas y no se rompe con un JSON vacío.
## 23
- $ pip install requests
- Escribe salud.py: recorre 5 URLs con requests.get(url, timeout=3)
- Agrega 3 reintentos con espera 1 s, 2 s, 4 s
- Muestra OK/FAIL y el tiempo de respuesta
- Incluye una URL inválida a propósito
- Prueba subprocess.run(['curl','-sI',url], check=True) para una verificación alterna
> El script no se cuelga ante una URL caída y reporta tiempos.
## 24
- $ pip install boto3
- $ aws configure   (o variables de entorno; nunca claves en el código)
- Escribe sin_tags.py: get_paginator('describe_instances') y lista las instancias sin la etiqueta Owner
- $ python sin_tags.py
- Si aún no tienes cuenta: $ pip install moto para simular EC2
> Lista correctamente los recursos que no tienen la etiqueta requerida.
## 25
- $ pip install pytest ruff pre-commit
- Crea test_resumen.py con 3 casos: normal, vacío y ok=False
- $ pytest -q
- $ ruff check . && ruff format .
- Crea .pre-commit-config.yaml con los hooks de ruff y $ pre-commit install
- Intenta un commit con un error de estilo
> Un commit con código mal formateado es rechazado por pre-commit.
## 26
- Estructura: mi-herramienta/{src, tests, README.md, pyproject.toml}
- Conviértelo en CLI con argparse y --help claro
- Devuelve exit code distinto de 0 ante un error
- $ git tag v0.1.0 && git push --tags
- Crea una Release en GitHub con notas
- README: qué hace, cómo instalar, cómo usar y un ejemplo
> Alguien puede instalar y usar tu herramienta solo con tu README.
## 27
- $ sudo unshare --pid --fork --mount-proc --uts --net bash
- Dentro: $ hostname   $ ps aux   $ ip a
- $ exit
- $ ls /sys/fs/cgroup   y   $ cat /proc/self/cgroup
- Compara con $ docker run --rm alpine ps aux
> Explicas qué aisló cada namespace y qué hace cgroups que unshare no hace.
## 28
- $ docker pull alpine:3.20 && docker pull nginx:1.27
- $ docker image inspect nginx:1.27 | head -40
- $ docker history nginx:1.27
- $ docker images --digests
- Analiza capas con dive (instalado o vía contenedor)
- Anota: tamaño total, número de capas y cuál pesa más
> Identificas la capa más pesada y propones 3 optimizaciones.
## 29
- Crea una app mínima con un Dockerfile ingenuo (FROM node:22, COPY . ., RUN npm install)
- $ docker build -t app:v1 . && docker images app
- Reescríbelo multi-stage: build en node:22 y final en node:22-slim, USER node, COPY package*.json antes del código
- Agrega .dockerignore (node_modules, .git)
- $ docker build -t app:v2 . && docker images app
> La imagen v2 pesa al menos 70% menos y corre como no root.
## 30
- $ docker network create red-app && docker volume create datos
- $ docker run -d --name db --network red-app -v datos:/var/lib/postgresql/data -e POSTGRES_PASSWORD=secreto postgres:16
- $ docker run --rm --network red-app -e PGPASSWORD=secreto postgres:16 psql -h db -U postgres -c 'select 1'
- $ docker rm -f db y vuelve a crearlo con el mismo volumen
- Comprueba que los datos siguen ahí
> El nombre «db» resuelve dentro de la red y los datos sobreviven al borrar el contenedor.
## 31
- Crea compose.yaml con web, db y redis; healthcheck en db
- En web: depends_on: db: condition: service_healthy
- Variables en un archivo .env
- $ docker compose up -d && docker compose ps
- $ docker compose logs -f web
- $ docker compose down   y luego   $ docker compose down -v
> web arranca solo cuando db está healthy.
## 32
- $ trivy image --severity HIGH,CRITICAL app:v2   (instala trivy o usa su contenedor)
- Cambia la imagen base a una más nueva o slim y repite
- Anota las CVEs antes y después
- $ trivy config .   (revisa tu Dockerfile)
> Reduces las CVEs críticas y documentas qué cambio las eliminó.
## 33
- Crea un PAT con permiso write:packages en GitHub
- $ echo $PAT | docker login ghcr.io -u TU_USUARIO --password-stdin
- $ docker tag app:v2 ghcr.io/TU_USUARIO/app:0.1.0
- $ docker push ghcr.io/TU_USUARIO/app:0.1.0
- $ docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/TU_USUARIO/app:0.1.0
- Haz pull por digest
> Descargas tu imagen por digest y sabes por qué es más seguro que latest.
## 34
- $ docker run -d --name oom --memory=20m python:3.12 python -c "x=' '*(100*1024*1024); import time; time.sleep(60)"
- $ docker inspect oom --format '{{.State.OOMKilled}} {{.State.ExitCode}}'
- $ docker run --name falla alpine sh -c 'exit 3'; docker inspect falla --format '{{.State.ExitCode}}'
- $ docker logs oom
- $ docker exec -it <contenedor-sano> sh
> Tienes un runbook de 5 síntomas con el comando de diagnóstico de cada uno.
## 35
- Dibuja el flujo de tu proyecto: commit → build → test → deploy → monitoreo
- Anota cuánto tarda cada etapa hoy (aunque sea manual)
- Calcula tu lead time y cuántas veces despliegas por semana
- Estima tu change failure rate
- Identifica el cuello de botella más grande
> Tienes un diagrama con tiempos y una frase: «mi mayor cuello de botella es X».
## 36
- Crea un repo con una app y tests
- $ mkdir -p .github/workflows && nano .github/workflows/ci.yml
- on: pull_request; job test con runs-on: ubuntu-latest; steps: checkout, setup, instalar, lint, tests
- $ git switch -c prueba-ci && git push -u origin prueba-ci
- Abre el PR y mira la pestaña Actions
- Rompe un test a propósito: el check debe ponerse rojo
> El PR muestra checks verdes y luego rojos cuando rompes algo.
## 37
- Agrega strategy.matrix con dos versiones (node 20 y 22, o python 3.11 y 3.12)
- Agrega caché de dependencias con la clave del lockfile (cache: npm en setup-node)
- Sube un artefacto con actions/upload-artifact (reporte de tests)
- Ejecuta dos veces y compara el tiempo de instalación
- Descarga el artefacto desde la interfaz
> Ves el job duplicarse por versión y la segunda ejecución más rápida por la caché.
## 38
- permissions: packages: write y contents: read
- Steps: docker/login-action (ghcr.io con GITHUB_TOKEN) y docker/build-push-action con tags ghcr.io/${{ github.repository }}:${{ github.sha }}
- cache-from y cache-to con type=gha
- Haz push a main y revisa Packages en tu repositorio
- $ docker pull ghcr.io/TU_USUARIO/REPO:<sha>
> Cada push a main publica una imagen etiquetada con su SHA.
## 39
- Crea los Environments «staging» y «production» en Settings
- En production: Required reviewers
- Job deploy con environment: production y un step que haga ssh/docker pull/restart en tu VPS o Cloud Run
- Dispara el workflow: debe esperar tu aprobación
- Despliega y luego simula un rollback con la imagen del SHA anterior
> El despliegue espera aprobación y puedes volver a la versión previa en un paso.
## 40
- Crea un proyecto en GitLab y un .gitlab-ci.yml
- stages: [build, test, deploy]
- Un job por stage; en test dos jobs en paralelo
- rules: - if: $CI_COMMIT_BRANCH == "main" en deploy
- Mueve parte a un include: local: ci/test.yml
- Mira el pipeline en CI/CD → Pipelines
> El pipeline equivale al de Actions y deploy solo corre en main.
## 41
- $ docker run -d --name jenkins -p 8080:8080 -v jenkins_home:/var/jenkins_home jenkins/jenkins:lts
- $ docker exec jenkins cat /var/jenkins_home/secrets/initialAdminPassword
- Instala los plugins sugeridos y crea un Pipeline desde SCM
- Jenkinsfile: pipeline { agent any; stages { stage('Build') { steps { sh 'echo build' } } stage('Test') { steps { sh 'echo test' } } } }
- Ejecuta y revisa Console Output
> Corre un pipeline declarativo desde un Jenkinsfile de tu repo.
## 42
- Elige tu pipeline más lento y mide cada etapa (Actions muestra tiempos)
- Aplica 3 mejoras: caché de dependencias, jobs independientes en paralelo y tests rápidos primero
- Mide de nuevo
- Detecta un test inestable ejecutándolo 20 veces en un bucle y contando fallos
- Escribe qué cambiaste y el % de mejora
> Reduces el tiempo al menos 30% y tienes el antes/después documentado.
## 43
- Crea la cuenta (free tier) y activa MFA en root
- IAM → crea un usuario administrador con MFA y deja de usar root
- Billing → Budgets → presupuesto de 5 USD con alerta por email
- Elige una región y anota sus zonas de disponibilidad
- $ aws sts get-caller-identity   (tras configurar el CLI)
> Tienes MFA, un usuario no-root y una alerta de presupuesto activa.
## 44
- Crea un bucket de prueba
- IAM → Policies → JSON: solo s3:GetObject y s3:PutObject sobre arn:aws:s3:::TU-BUCKET/*
- Crea un rol y adjúntale la política
- En el Policy Simulator prueba s3:DeleteObject (debe denegar)
- $ aws iam simulate-principal-policy --policy-source-arn <ARN-ROL> --action-names s3:DeleteObject
